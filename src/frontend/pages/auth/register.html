<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Registrácia – Decentralizovaná knižnica</title>
    <link rel="stylesheet" href="../../assets/css/index.css" />
    <link rel="stylesheet" href="../../assets/css/auth.css" />
</head>
<body>
    <div class="auth-container">
        <h2>Registrácia</h2>

        <div class="form-group-row">
            <div class="form-group">
                <label for="first_name">Meno</label>
                <input type="text" id="first_name" placeholder="Zadajte meno" />
            </div>

            <div class="form-group">
                <label for="last_name">Priezvisko</label>
                <input type="text" id="last_name" placeholder="Zadajte priezvisko" />
            </div>
        </div>

        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="Zadajte email" />
        </div>

        <div class="form-group">
            <label for="password">Heslo</label>
            <input type="password" id="password" placeholder="Zadajte heslo" />
        </div>

        <div class="form-group">
            <label for="password2">Potvrdenie hesla</label>
            <input type="password" id="password2" placeholder="Zopakujte heslo" />
        </div>

        <button class="auth-button" onclick="register()">Vytvoriť účet</button>

        <div class="auth-link">
            Už máte účet? <a href="login.html">Prihláste sa</a>
        </div>
    </div>
</body>
<script type="module" src="../../assets/js/auth.js"></script>
</html>
