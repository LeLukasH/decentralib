<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decentralizovaná knižnica</title>
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/book_detail_modal.css"> 

    <script type="module" src="../assets/js/pozicane.js"></script>
    <script type="module" src="../assets/js/book_detail_modal.js"></script>
    <script type="module" src="../assets/js/header_footer.js"></script>
</head>

<body>

    <div>
	    <my-header></my-header>
    </div>


    <div class="obsah">
        
        <div class="list-knih-sekcia">
            <h2>Požičané knihy</h2> 

            <!-- <h3>Vyhľadávanie</h3> -->

            <div id="vyhladavanie">
                <input type="text" placeholder="Názov" class="vyhladavanie-item" style="max-width: 300px; width: 90%;">
                <input type="text" placeholder="Autor" class="vyhladavanie-item" style="max-width: 300px; width: 90%; ">

                 <button type="button">Hľadaj</button>
            </div>
           

            <div class="vysledky-vyhladavania">
                <h3 id="vysledky-nadpis">Všetky tituly</h3> 
                <!-- <pre id="vypis"></pre> -->
            </div>

            <!-- <button id="vymaz-filtre" style="display:none;">Vymazať všetky filtre</button> -->

            <!-- <div class="zoznam-knih" id="zoznam-knih">
            </div> -->
            

            <!-- dočasný div-->
            <div style="height:400px;">tu budú knihy</div>
            
        </div>

    
        
    </div>

    <div id="bookDetailModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            
            <h2 id="modal-title" class="modal-title">Názov knihy</h2>
            
            <div class="modal-body">
                <div class="book-cover">
                    <img id="modal-image" src="" alt="Obal knihy" width="130" height="200"> 
                </div>
                
                <div class="book-info">
                    <p id="modal-author" class="info-item author">Autor</p>
                    <div class="info-item owner-rating">
                        <span id="modal-owner">Vlastník</span>
                        <span class="rating-star">&#9733;</span>
                        <span id="modal-rating" class="rating-value">4,7</span>
                    </div>
                    <p id="modal-count" class="info-item">Počet hodnotení: 4</p>
                    <p id="modal-location" class="info-item">Lokalita</p>
                    
                    <div class="borrow-form">
                        <label for="date-from">Požičanie od:</label>
                        <input type="date" id="date-from">
                        <label for="date-to">do:</label>
                        <input type="date" id="date-to">
                    </div>
                    
                    <button id="request-borrow" class="request-button">Požiadať o požičanie</button>
                </div>
            </div>

            <div class="book-specs">
                <p><strong>Jazyk:</strong> <span id="modal-language">Jazyk</span></p>
                <p><strong>Žáner:</strong> <span id="modal-genre">Žáner</span></p>
            </div>

            <div class="book-description">
                <h3 class="description-title">Popis</h3>
                <div class="description-roll-up">
                    <p id="modal-description-full" class="description-text">
                        Popis knihy...
                    </p>
                    <button id="toggle-description-button" class="toggle-button">
                        Čítať celý popis (...)
                    </button>
                </div>
            </div>

        </div>
    </div>
    <my-footer></my-footer>
</body>
</html>
