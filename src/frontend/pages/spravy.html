<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decentralizovaná knižnica</title>
    <link rel="stylesheet" href="../assets/css/index.css">
    
    <script type="module" src="../assets/js/header_footer.js"></script>
</head>

<body>
    <div>
	    <my-header></my-header>
    </div>
    <h1 class="Nadpis">Správy</h1>
    <div class="spravy">
        <div class="chat">
            <h2 class="spravy-blok">Chat</h2>
            <div class ="spravy-kontajner">Nemáte dostupný chat so žiadnym používateľom.</div>
        </div>
        <div class="notifikacie">
            <h2 class="spravy-blok">Notifikácie</h2>
            <div class="spravy-blok">
                <h3>Filter</h3>
                
                <div class="filter-skupina" id="spravy-filter">
                    
                        <div>
                            <input type="checkbox" id="prijate-ziadosti">
                            <label for="prijate-ziadosti">Prijaté žiadosti</label>
                        </div>

                        <div>
                            <input type="checkbox" id="odoslane-ziadosti">
                            <label for="odoslane-ziadosti">Odoslané žiadosti</label>
                        </div>

                        <div>
                            <input type="checkbox" id="koniec-vypozicky">
                            <label for="koniec-vypozicky">Koniec výpožičky</label>
                        </div>

                        <div>
                            <input type="checkbox" id="potvrdenie-vypozicky">
                            <label for="potvrdenie-vypozicky">Potvrdenie výpožičky</label>
                        </div>
                </div>
            </div>
            <div class ="spravy-kontajner">Nemáte žiadne správy. </div>
        </div>
    </div>
    <my-footer class="spravy-footer"></my-footer>
</body>
</html>
