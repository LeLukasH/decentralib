<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Moje Výpožičky | Decentralizovaná knižnica</title>
    
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/book_detail_modal.css"> 
    <link rel="stylesheet" href="../assets/css/vypozicky.css"> <script type="module" src="../assets/js/vypozicky.js"></script> 
    <script type="module" src="../assets/js/header_footer.js"></script>
    
</head>

<body>

    <div>
        <my-header></my-header>
    </div>

    <div class="obsah">
        <div class="list-vypoziciek-sekcia">
            
            <h1 class="Nadpis">Moje výpožičky</h1>

            <div class="prepinatele-vypoziciek">
                <button id="btnSchvalene" class="prepinatele-tlacidlo active">Schválené výpožičky</button>
                <button id="btnCakajuce" class="prepinatele-tlacidlo">Čakajúce na schválenie</button>
            </div>
            
            <div id="schvaleneVypozicky" class="zoznam-vypoziciek">
                <h3>📚 Aktuálne požičané knihy (Schválené)</h3>
                
                <div class="zoznam-kariet" id="zoznam-schvalenych">
                    <div class="karta-vypozicky">
                        <div class="karta-content">
                            <img src="https://via.placeholder.com/80x120?text=S1" alt="Obal knihy" width="80" height="120">
                            <div class="karta-info">
                                <h4>Hobbit</h4>
                                <p><strong>Autor:</strong> J.R.R. Tolkien</p>
                                <p><strong>Požičal si:</strong> Jano Novák (4.5/5)</p>
                                <p><strong>Od:</strong> 01.01.2026 <strong>Do:</strong> 15.01.2026</p>
                            </div>
                        </div>
                        <button class="request-button" style="background-color: #1e8543; margin-top: 10px;">Potvrdiť vrátenie</button>
                    </div>
                </div>
                
                <div class="pagination-controls" id="pagination-schvalene">
                    </div>
            </div>

            <div id="cakajuceVypozicky" class="zoznam-vypoziciek hidden">
                <h3>⏳ Čakajúce požiadavky na schválenie</h3>
                
                <div class="zoznam-kariet" id="zoznam-cakajucich">
                    <div class="karta-vypozicky">
                        <div class="karta-content">
                            <img src="https://via.placeholder.com/80x120?text=C1" alt="Obal knihy" width="80" height="120">
                            <div class="karta-info">
                                <h4>1984</h4>
                                <p><strong>Autor:</strong> George Orwell</p>
                                <p><strong>Žiadateľ:</strong> Fero Kováč (4.8/5)</p>
                                <p><strong>Požadované:</strong> 01.02.2026 - 10.02.2026</p>
                            </div>
                        </div>
                        <div class="action-buttons" style="display: flex; gap: 10px; margin-top: 10px;">
                            <button class="request-button" style="background-color: #2f70e9; flex: 1;">Schváliť</button>
                            <button class="request-button" style="background-color: #c62828; flex: 1;">Zamietnuť</button>
                        </div>
                    </div>
                </div>

                <div class="pagination-controls" id="pagination-cakajuce">
                    </div>
            </div>
            
        </div>
    </div>
    
    <div id="bookDetailModal" class="modal">
        <div class="modal-content">
            <span class="close-button">&times;</span>
            <h2 id="modal-title" class="modal-title">Názov knihy</h2>
            </div>
    </div>
    
    <my-footer></my-footer>
</body>
</html>
