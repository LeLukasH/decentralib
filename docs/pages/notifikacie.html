<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Decentralizovaná knižnica</title>
    <link rel="stylesheet" href="../assets/css/index.css">
    <link rel="stylesheet" href="../assets/css/notifikacie.css">
    <link rel="stylesheet" href="../assets/css/review_modal.css">
    
    <script type="module" src="../assets/js/header_footer.js"></script>
    <script type="module" src="../assets/js/review_modal.js"></script>

</head>

<div id="reviewModal" class="modal hidden">
    <div class="modal-backdrop"></div>

    <div class="modal-content">
        <h2>Hodnotenie používateľa</h2>
        <span id="reviewModalTitle"></span>
        <span id="reviewModalSubtitle"></span>

        <div class="rating">
            <span data-value="1">★</span>
            <span data-value="2">★</span>
            <span data-value="3">★</span>
            <span data-value="4">★</span>
            <span data-value="5">★</span>
        </div>

        <textarea
            id="reviewText"
            placeholder="Napíšte krátke hodnotenie (nepovinné)"
        ></textarea>

        <div class="modal-actions">
            <button id="cancelReview">Zrušiť</button>
            <button id="submitReview" disabled>Odoslať</button>
        </div>
    </div>
</div>

<body>
    <my-header></my-header>
    
        <div class="notifications-div">
            <h2>Notifikácie</h2>
            
            <div id="notificationsContainer"></div>
        </div>
        
    <my-footer></my-footer>
</body>
</html>
