<div id="reviewDetailModal" class="modal">
    <!-- modalne okno pre pridanie hodnotenia
     prebera toho vela z modalneho detailu knihy -->
    <div class="modal-content">
        <span class="close-button">&times;</span>
        
        <h2 id="modal-title" class="modal-title">Názov knihy</h2>
        
        <div class="modal-body">
          
            <div class="review-info">
                <p id="modal-author" class="info-item author">Autor</p>
                <div class="info-item owner-rating">
                    <span id="modal-owner">Vlastník</span>
                </div>
                
                <div class="borrow-form">
                    <label for="review-number">Pick a number (1-5):</label>
                    <input type="number" id="review-number" name="review-number" min="1" max="5" step="1" required>
                    <label for="review-text">textove hodnotenie</label>
                    <input type="text" id="review-text" required>

                </div>
                
                <button id="review-button" class="request-button">ohodnotiť</button>
            </div>
        </div>

    </div>
</div>
